title: Layered ggplot
name: layerPlot
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: "X axis"
        children:
          - type: VariablesListBox
            name: 'x'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Y axis"
        children:
          - type: VariablesListBox
            name: 'y'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Colour"
        children:
          - type: VariablesListBox
            name: 'colour'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Fill"
        children:
          - type: VariablesListBox
            name: 'fill'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Shape (categorical)"
        children:
          - type: VariablesListBox
            name: 'shape'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Size"
        children:
          - type: VariablesListBox
            name: 'sizeBy'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Opacity"
        children:
          - type: VariablesListBox
            name: 'alphaBy'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Group"
        children:
          - type: VariablesListBox
            name: 'group'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Label (text and label layers)"
        children:
          - type: VariablesListBox
            name: 'label'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Y min (ribbons, error bars)"
        children:
          - type: VariablesListBox
            name: 'ymin'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Y max (ribbons, error bars)"
        children:
          - type: VariablesListBox
            name: 'ymax'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "X end (segments)"
        children:
          - type: VariablesListBox
            name: 'xend'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Y end (segments)"
        children:
          - type: VariablesListBox
            name: 'yend'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Facet by (wrap) / rows (grid)"
        children:
          - type: VariablesListBox
            name: 'facetVar1'
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: "Facet columns (grid only)"
        children:
          - type: VariablesListBox
            name: 'facetVar2'
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: addLayer
  - type: CollapseBox
    label: Layer 1
    collapsed: false
    children:
      - type: ComboBox
        name: act1
      - type: ComboBox
        name: l1_type
      - type: CheckBox
        name: l1_enabled
      - type: CheckBox
        name: l1_inherit
      - type: TextBox
        name: l1_alpha
        format: number
      - type: TextBox
        name: l1_size
        format: number
      - type: TextBox
        name: l1_width
        format: number
      - type: ComboBox
        name: l1_position
      - type: ComboBox
        name: l1_stat
      - type: ComboBox
        name: l1_method
        enable: (l1_type:smooth)
      - type: CheckBox
        name: l1_se
        enable: (l1_type:smooth)
      - type: TextBox
        name: l1_bins
        format: number
        enable: (l1_type:histogram)
      - type: TextBox
        name: l1_intercept
        format: number
      - type: TextBox
        name: l1_slope
        format: number
        enable: (l1_type:abline)
  - type: CollapseBox
    label: Layer 2
    collapsed: false
    children:
      - type: ComboBox
        name: act2
      - type: ComboBox
        name: l2_type
      - type: CheckBox
        name: l2_enabled
      - type: CheckBox
        name: l2_inherit
      - type: TextBox
        name: l2_alpha
        format: number
      - type: TextBox
        name: l2_size
        format: number
      - type: TextBox
        name: l2_width
        format: number
      - type: ComboBox
        name: l2_position
      - type: ComboBox
        name: l2_stat
      - type: ComboBox
        name: l2_method
        enable: (l2_type:smooth)
      - type: CheckBox
        name: l2_se
        enable: (l2_type:smooth)
      - type: TextBox
        name: l2_bins
        format: number
        enable: (l2_type:histogram)
      - type: TextBox
        name: l2_intercept
        format: number
      - type: TextBox
        name: l2_slope
        format: number
        enable: (l2_type:abline)
  - type: CollapseBox
    label: Layer 3
    collapsed: true
    children:
      - type: ComboBox
        name: act3
      - type: ComboBox
        name: l3_type
      - type: CheckBox
        name: l3_enabled
      - type: CheckBox
        name: l3_inherit
      - type: TextBox
        name: l3_alpha
        format: number
      - type: TextBox
        name: l3_size
        format: number
      - type: TextBox
        name: l3_width
        format: number
      - type: ComboBox
        name: l3_position
      - type: ComboBox
        name: l3_stat
      - type: ComboBox
        name: l3_method
        enable: (l3_type:smooth)
      - type: CheckBox
        name: l3_se
        enable: (l3_type:smooth)
      - type: TextBox
        name: l3_bins
        format: number
        enable: (l3_type:histogram)
      - type: TextBox
        name: l3_intercept
        format: number
      - type: TextBox
        name: l3_slope
        format: number
        enable: (l3_type:abline)
  - type: CollapseBox
    label: Layer 4
    collapsed: true
    children:
      - type: ComboBox
        name: act4
      - type: ComboBox
        name: l4_type
      - type: CheckBox
        name: l4_enabled
      - type: CheckBox
        name: l4_inherit
      - type: TextBox
        name: l4_alpha
        format: number
      - type: TextBox
        name: l4_size
        format: number
      - type: TextBox
        name: l4_width
        format: number
      - type: ComboBox
        name: l4_position
      - type: ComboBox
        name: l4_stat
      - type: ComboBox
        name: l4_method
        enable: (l4_type:smooth)
      - type: CheckBox
        name: l4_se
        enable: (l4_type:smooth)
      - type: TextBox
        name: l4_bins
        format: number
        enable: (l4_type:histogram)
      - type: TextBox
        name: l4_intercept
        format: number
      - type: TextBox
        name: l4_slope
        format: number
        enable: (l4_type:abline)
  - type: CollapseBox
    label: Layer 5
    collapsed: true
    children:
      - type: ComboBox
        name: act5
      - type: ComboBox
        name: l5_type
      - type: CheckBox
        name: l5_enabled
      - type: CheckBox
        name: l5_inherit
      - type: TextBox
        name: l5_alpha
        format: number
      - type: TextBox
        name: l5_size
        format: number
      - type: TextBox
        name: l5_width
        format: number
      - type: ComboBox
        name: l5_position
      - type: ComboBox
        name: l5_stat
      - type: ComboBox
        name: l5_method
        enable: (l5_type:smooth)
      - type: CheckBox
        name: l5_se
        enable: (l5_type:smooth)
      - type: TextBox
        name: l5_bins
        format: number
        enable: (l5_type:histogram)
      - type: TextBox
        name: l5_intercept
        format: number
      - type: TextBox
        name: l5_slope
        format: number
        enable: (l5_type:abline)
  - type: CollapseBox
    label: Layer 6
    collapsed: true
    children:
      - type: ComboBox
        name: act6
      - type: ComboBox
        name: l6_type
      - type: CheckBox
        name: l6_enabled
      - type: CheckBox
        name: l6_inherit
      - type: TextBox
        name: l6_alpha
        format: number
      - type: TextBox
        name: l6_size
        format: number
      - type: TextBox
        name: l6_width
        format: number
      - type: ComboBox
        name: l6_position
      - type: ComboBox
        name: l6_stat
      - type: ComboBox
        name: l6_method
        enable: (l6_type:smooth)
      - type: CheckBox
        name: l6_se
        enable: (l6_type:smooth)
      - type: TextBox
        name: l6_bins
        format: number
        enable: (l6_type:histogram)
      - type: TextBox
        name: l6_intercept
        format: number
      - type: TextBox
        name: l6_slope
        format: number
        enable: (l6_type:abline)
  - type: CollapseBox
    label: Facets
    collapsed: true
    children:
      - type: ComboBox
        name: facetType
      - type: ComboBox
        name: facetScales
      - type: TextBox
        name: facetCols
        format: number
        enable: (facetType:wrap)
  - type: CollapseBox
    label: Axes and coordinates
    collapsed: true
    children:
      - type: ComboBox
        name: xTrans
      - type: ComboBox
        name: yTrans
      - type: TextBox
        name: xMin
        format: string
      - type: TextBox
        name: xMax
        format: string
      - type: TextBox
        name: yMin
        format: string
      - type: TextBox
        name: yMax
        format: string
      - type: ComboBox
        name: rangeMode
      - type: ComboBox
        name: coordType
  - type: CollapseBox
    label: Colour and fill scales
    collapsed: true
    children:
      - type: ComboBox
        name: colourPalette
      - type: TextBox
        name: colourValues
        format: string
        enable: (colourPalette:manual)
      - type: ComboBox
        name: fillPalette
      - type: TextBox
        name: fillValues
        format: string
        enable: (fillPalette:manual)
  - type: CollapseBox
    label: Legend
    collapsed: true
    children:
      - type: ComboBox
        name: legendPosition
      - type: TextBox
        name: colourTitle
        format: string
      - type: TextBox
        name: fillTitle
        format: string
      - type: TextBox
        name: shapeTitle
        format: string
      - type: TextBox
        name: sizeTitle
        format: string
      - type: TextBox
        name: alphaTitle
        format: string
  - type: CollapseBox
    label: Labels and theme
    collapsed: true
    children:
      - type: TextBox
        name: title
        format: string
      - type: TextBox
        name: subtitle
        format: string
      - type: TextBox
        name: caption
        format: string
      - type: TextBox
        name: xlab
        format: string
      - type: TextBox
        name: ylab
        format: string
      - type: ComboBox
        name: theme
      - type: CheckBox
        name: showCode
  - type: CollapseBox
    label: Theme details
    collapsed: true
    children:
      - type: TextBox
        name: baseSize
        format: number
      - type: ComboBox
        name: baseFamily
      - type: CheckBox
        name: hideGridMajor
      - type: CheckBox
        name: hideGridMinor
      - type: CheckBox
        name: hideTicks
      - type: ComboBox
        name: xTextAngle
      - type: CheckBox
        name: boldTitle
      - type: TextBox
        name: plotFill
        format: string
      - type: TextBox
        name: panelFill
        format: string
      - type: TextBox
        name: plotMargin
        format: string
