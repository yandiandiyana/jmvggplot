    title: "Facet by (wrap) / rows (grid)"
    type: Variable
    permitted: [factor]
    default: null
  - name: facetVar2
    title: "Facet columns (grid only)"
    type: Variable
    permitted: [factor]
    default: null

  - name: addLayer
    title: "Add layer"
    type: List
    options:
      - name: "none"
        title: "Choose a type to add..."
