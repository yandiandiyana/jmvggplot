name: layerPlot
title: Layered ggplot
menuGroup: .
version: '0.0.1'
jas: '1.2'
category: plots
description:
    main: Builds a ggplot2 plot from an ordered list of layers and shows the equivalent R code.
    R:
        dontrun: true
        usage: |
            # not intended for use outside jamovi in this stage
options:
  - name: data
    type: Data
    description:
        R: the data as a data frame

  - name: x
    title: "X axis"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: y
    title: "Y axis"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: colour
    title: "Colour"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: fill
    title: "Fill"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: shape
    title: "Shape (categorical)"
    type: Variable
    permitted: [factor]
    default: null
  - name: sizeBy
    title: "Size"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: alphaBy
    title: "Opacity"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: group
    title: "Group"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: label
    title: "Label (text and label layers)"
    type: Variable
    permitted: [numeric, factor]
    default: null
  - name: ymin
    title: "Y min (ribbons, error bars)"
    type: Variable
    permitted: [numeric]
    default: null
